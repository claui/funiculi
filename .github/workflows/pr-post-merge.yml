name: PR post-merge

on:
  pull_request_target:
    types: [closed]

jobs:
  ci-checks:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml

  build-dist:
    if: github.event.pull_request.merged == true
    needs: ci-checks
    uses: ./.github/workflows/build-dist.yml
    with:
      ref: ${{ github.sha }}

  publish-release:
    if: >-
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'auto-release')
      && startsWith(github.head_ref, 'release/')
    needs: build-dist
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/funiculi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

      - name: Sign the distributions
        uses: sigstore/gh-action-sigstore-python@61f6a500bbfdd9a2a339cf033e5421951fbc1cd2  # v2.1.1
        with:
          inputs: >-
            dist/*.tar.gz
            dist/*.whl

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
          MERGE_COMMIT: ${{ github.sha }}
        run: |
          set -ex
          VERSION="${RELEASE_BRANCH#release/}"
          gh release create "v${VERSION}" --draft --generate-notes \
            --repo "${REPOSITORY}" --target "${MERGE_COMMIT}"
          gh release upload "v${VERSION}" dist/* \
            --repo "${REPOSITORY}"
